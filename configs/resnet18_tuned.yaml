# resnet18_tuned: full-budget retrain of the best tuned setting; keeps resnet18_finetune intact.
# After tuning, copy from outputs/tuning/<method>.json (best_params): lr_backbone = best lr,
# lr_head = 10 x best lr, plus the best weight_decay and dropout.
seed: 42
checkpoint_dir: outputs/checkpoints
encoder:
  name: resnet18
  pretrained: true
  freeze: false
data:
  num_classes: 200
  val_fraction: 0.2
  image_size: 224
  num_workers: 2  # set to 0 if DataLoader workers hang on Windows
train:
  epochs: 30
  patience: 7
  lr_backbone: 3.0e-4
  lr_head: 3.0e-3
  weight_decay: 1.0e-4
  dropout: 0.2
  batch_size: 64
  label_smoothing: 0.1
tracker:
  name: wandb
  project: pixels-to-language
  group: m1-runs
  run_name: resnet18_tuned
