# tune_resnet18: base run config (ResNet-18 pretrained, fine-tuned) + search spaces.
# The tuner overrides lr_backbone, lr_head (10x), weight_decay, dropout, epochs per trial.
seed: 42
checkpoint_dir: outputs/checkpoints
encoder:
  name: resnet18
  pretrained: true
  freeze: false
data:
  num_classes: 200
  val_fraction: 0.2
  image_size: 224
  num_workers: 2  # set to 0 if DataLoader workers hang on Windows
train:
  epochs: 8
  patience: 7
  lr_backbone: 1.0e-4
  lr_head: 1.0e-3
  weight_decay: 1.0e-4
  dropout: 0.5
  batch_size: 64
  label_smoothing: 0.1
tracker:
  name: wandb
  project: pixels-to-language
  group: tune
  run_name: tune_resnet18
tuning:
  n_trials: 6
  epochs_per_trial: 5
  grid:
    lr: [1.0e-4, 3.0e-4, 1.0e-3]
    weight_decay: [1.0e-4]
    dropout: [0.2, 0.5]
  random:
    lr: {type: log_uniform, low: 1.0e-4, high: 1.0e-3}
    weight_decay: {type: log_uniform, low: 1.0e-4, high: 1.0e-2}
    dropout: {type: uniform, low: 0.2, high: 0.5}
